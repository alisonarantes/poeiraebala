<style>
  /* Layout: palco único centralizado, canvas pixelado em escala inteira de tela, dica de controles embaixo. */
  :root {
    --night: #1b1410;
    --sand: #e9d9b0;
    --rust: #b4532a;
    --gold: #e9b44c;
    --ink: #2a1d14;
    --frame: #3a2a1c;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--sand);
    font-family: "Barlow Condensed", ui-sans-serif, Arial Narrow, sans-serif;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; }
  canvas {
    display: block;
    image-rendering: auto;
    background: #d4aa6e;
    border: 3px solid var(--frame);
    box-shadow: 0 0 0 2px var(--ink), 0 8px 30px rgba(0,0,0,.55);
    touch-action: none;
  }
  .hint {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
    font-size: clamp(15px, 2.4vmin, 22px); line-height: 1.5; font-weight: 600; color: var(--sand); opacity: .9;
    max-width: 900px; text-align: center;
  }
  kbd {
    font-family: inherit; font-weight: 700; font-size: 1em; color: var(--ink); background: var(--sand);
    border-radius: 2px; padding: 1px .35em; margin-inline: 1px; box-shadow: 0 2px 0 var(--rust);
  }
    .pad { display: none; width: 100%; max-width: 640px; justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  #joy {
    position: relative; width: clamp(130px, 30vmin, 210px); height: clamp(130px, 30vmin, 210px); border-radius: 50%;
    border: 3px solid var(--frame); background: rgba(233,217,176,.08); touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; margin: -20% 0 0 -20%;
    border-radius: 50%; background: var(--gold); box-shadow: 0 3px 0 var(--rust); pointer-events: none;
  }
  .aim { display: flex; gap: 12px; }
  .aim button {
    width: clamp(84px, 22vmin, 140px); height: clamp(84px, 22vmin, 140px); border-radius: 8px; border: 3px solid var(--frame);
    background: var(--sand); color: var(--ink); font: clamp(32px, 8vmin, 56px) "Barlow Condensed", sans-serif;
    box-shadow: 0 4px 0 var(--rust); touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0;
  }
  .aim button.on { background: var(--gold); transform: translateY(3px); box-shadow: 0 1px 0 var(--rust); }
  @media (pointer: coarse) { .pad { display: flex; } .hint { display: none; } }
</style>

<div class="stage"><canvas id="c" width="256" height="320" aria-label="Jogo de tiro no faroeste"></canvas></div>
<div class="hint" id="hint">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover</span>
  <span><kbd>←</kbd> atira para a esquerda</span>
  <span><kbd>→</kbd> atira para a direita</span>
  <span><kbd>↑</kbd> <kbd>↓</kbd> ou nada: frente</span>
  <span><kbd>P</kbd> pausa · <kbd>M</kbd> som</span>
</div>
<div class="pad" id="pad">
  <div id="joy" aria-label="Mover"><div id="knob"></div></div>
  <div class="aim" aria-label="Mira">
    <button type="button" data-aim="l" aria-label="Atirar na diagonal esquerda">↖</button>
    <button type="button" data-aim="r" aria-label="Atirar na diagonal direita">↗</button>
    <button type="button" id="jumpBtn" aria-label="Pular" style="display:none;font-size:clamp(13px,3vmin,22px)">PULAR</button>
  </div>
</div>

const hitS = (b, bx, by, hw, hh) => {
  if (b.px === undefined) return hit(b.x, b.y, bx, by, hw, hh);
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - b.px, b.y - b.py) / 3));
  for (let i = 1; i <= n; i++) if (hit(b.px + (b.x - b.px) * i / n, b.py + (b.y - b.py) * i / n, bx, by, hw, hh)) return true;
  return false;
};

/* ---------- Sprites (pixel art desenhada em código) ---------- */
function sprite(rows, pal, sc = 1) {

  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const col = cell(x, y);
    if (col) {
      let cc = col;
      if (hex(col)) { if (!cell(x, y - 1)) cc = sh(col, 34); else if (!cell(x, y + 1)) cc = sh(col, -34); else if (!cell(x - 1, y)) cc = sh(col, 14); else if (!cell(x + 1, y)) cc = sh(col, -22); }
